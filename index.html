<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor Głosowań Sejmowych</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 20px; 
            background-color: #f0f4f8; 
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 1200px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            box-sizing: border-box;
        }
        h1 { 
            color: #004b87; 
            margin-top: 0;
            border-bottom: 3px solid #004b87;
            padding-bottom: 10px;
        }
        p {
            color: #555;
            font-size: 1.1em;
            line-height: 1.6;
        }
        .iframe-wrapper {
            position: relative;
            width: 100%;
            height: 800px;
            margin-top: 20px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            overflow: hidden;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .footer {
            margin-top: 20px;
            font-size: 0.9em;
            color: #888;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>System Monitorowania Głosowań Sejmowych</h1>
        <p>Poniższy panel wyświetla oficjalny, interaktywny i najświeższy rejestr prac oraz głosowań bezpośrednio z bazy danych <strong>Sejmu Rzeczypospolitej Polskiej</strong> (X Kadencja).</p>
        
        <div class="iframe-wrapper">
            <!-- Wczytujemy oficjalny komponent sejmowy, który omija wszelkie blokady CORS -->
            <iframe src="https://sejm.gov.pl"></iframe>
        </div>
        
        <div class="footer">
            Projekt utworzony własnoręcznie | Dane źródłowe: sejm.gov.pl
        </div>
    </div>

</body>
</html>
